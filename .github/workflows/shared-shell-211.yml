name: Prepare verified Monstudy 2.1.1 sources
on:
  push:
    branches: ['codex/shared-shell-2.1.1']
    paths: ['.github/workflows/shared-shell-211.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-shell-2.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified release changes
        shell: python
        run: |
          import base64,json,pathlib,subprocess
          expected=json.loads(base64.b64decode('eyJpbmRleC5odG1sIjogImUyMGM5OTBlNmY2YjlmMzFiMGY2ODk0YzM5MGEwYTcyODUxNGYzOGUiLCAid29yZC1icmVha2VyLmpzIjogIjA2MzBkMDU4MTE4NGE2OWQ3YTJjNTZlNGI0ODNjMWIzNGVjMGI5NDQifQ=='))
          for path,wanted in expected.items():
              p=pathlib.Path(path)
              if wanted is None:
                  assert not p.exists(), 'Unexpected existing file: '+path
              else:
                  actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
                  assert actual==wanted, 'Concurrent source change: '+path
          patch=base64.b64decode('')
          subprocess.run(['git','apply','--check','--unidiff-zero','--whitespace=nowarn','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--whitespace=nowarn','-'],input=patch,check=True)
          pathlib.Path('/tmp/monstudy-changed.json').write_text(json.dumps(list(expected)))
      - name: Commit verified source to preparation branch
        shell: python
        run: |
          import json,subprocess
          files=json.load(open('/tmp/monstudy-changed.json'))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','commit','-m','Implement shared Monstudy 2.1.1 navigation and material integration'],check=True)
          subprocess.run(['git','push','origin','HEAD:codex/shared-shell-2.1.1'],check=True)
